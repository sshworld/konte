<!doctype html>
<meta charset="utf-8">
<title>konte</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #111; }
  #stage { position: relative; overflow: hidden; font: 600 11px/1 "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  #pic { position: relative; overflow: hidden; }
  #pic canvas { display: block; }
  #slate { height: 26px; box-sizing: border-box; padding: 0 9px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }
  #slate b { font-weight: 800; } #slate .sp { flex: 1; } #slate .dim { opacity: 0.62; font-weight: 500; }
  #cap { box-sizing: border-box; padding: 7px 9px 9px; font-weight: 500; font-size: 12px; line-height: 1.35; min-height: 46px; }
  .tag { position: absolute; transform: translate(-50%, -100%); font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; white-space: nowrap; color: #fff; }
  .l3d #slate, .l3d #cap { background: #17181c; color: #f2f3f5; }
  .l2d { background: #f4f0e6; } .l2d #slate, .l2d #cap { background: #f4f0e6; color: #1b1b20; }
  .l2d #slate { border-bottom: 1.5px solid #1b1b20; } .l2d #cap { border-top: 1.5px solid #1b1b20; }
  .l2d .tag { color: #1b1b20; background: #f4f0e6 !important; border: 1px solid #1b1b20; }
</style>
<div id="stage"><div id="slate"></div><div id="pic"></div><div id="cap"></div></div>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<script type="module">
// Draws a stage (src/stage.js) frame by frame. One staging, two looks:
//   look=3d  lit greybox, one colour per cast member
//   look=2d  flat three-tone fills with even ink lines on paper
// hud=review adds a slate strip outside the picture, name tags and travel lines; hud=clean is the picture alone.
import * as THREE from "three";
import { loadSpec, lint, actorAt, blocked, frameRanges, frameOfBeat } from "./stage.js";
import { poseOf } from "./pose.js";
import { cameraWords } from "./prompts.js";

const q = new URLSearchParams(location.search);
const LOOK = q.get("look") ?? "3d", TWO = LOOK === "2d", REVIEW = (q.get("hud") ?? "review") === "review", CAPTIONS = q.get("captions") === "1";
const spec = await (await fetch(q.get("spec"))).json();
const stage = loadSpec(spec);
if (stage.errors.length) { window.KONTE = { ready: true, run: q.get("run"), errors: stage.errors }; throw new Error(stage.errors.join("\n")); }
const W = stage.width, H = stage.height, FPS = Number(q.get("fps") ?? stage.fps);
const root = document.getElementById("stage"), pic = document.getElementById("pic"), slate = document.getElementById("slate"), cap = document.getElementById("cap");
root.className = TWO ? "l2d" : "l3d"; root.style.width = W + "px"; pic.style.width = W + "px"; pic.style.height = H + "px";
if (!REVIEW) slate.remove(); if (!REVIEW || !CAPTIONS) cap.remove();
const OUT_H = H + (REVIEW ? 26 : 0) + (REVIEW && CAPTIONS ? 46 : 0);
root.style.height = OUT_H + "px";

const INK = new THREE.Color(0x1b1b20), PAPER = new THREE.Color(0xf4f0e6);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(W, H);
renderer.shadowMap.enabled = !TWO; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
pic.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45, W / H, 0.08, 500);

// An ink line of constant width on screen: the back faces of a shell pushed out along the normal in clip space.
const lineMat = (px) => new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { px: { value: px }, res: { value: new THREE.Vector2(W, H) } },
  vertexShader: "uniform float px; uniform vec2 res; void main(){ vec4 c = projectionMatrix * modelViewMatrix * vec4(position, 1.0); vec3 n = normalize(normalMatrix * normal); vec2 d = n.xy; float l = length(d); if (l > 1e-4) c.xy += d / l * px * 2.0 / res * c.w; gl_Position = c; }",
  fragmentShader: "void main(){ gl_FragColor = vec4(0.106, 0.106, 0.125, 1.0); }" });
const LINE = lineMat(1.7), LINE_THIN = lineMat(1.1);
const ramp = new THREE.DataTexture(new Uint8Array([128, 128, 128, 255, 204, 204, 204, 255, 255, 255, 255, 255]), 3, 1); ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const mats = new Map();
function mat(color, kind = "solid") {
  const key = color + kind + LOOK; if (mats.has(key)) return mats.get(key);
  const c = new THREE.Color(color);
  const m = TWO ? new THREE.MeshToonMaterial({ color: kind === "cast" ? c.clone().lerp(new THREE.Color(0xffffff), 0.3) : new THREE.Color(kind === "far" ? 0xddd6c6 : 0xfbf8f0), gradientMap: ramp })
                : new THREE.MeshStandardMaterial({ color: c, roughness: 0.82 });
  mats.set(key, m); return m;
}
function solid(parent, geo, color, kind = "solid", thin = false) {
  const m = new THREE.Mesh(geo, mat(color, kind)); m.castShadow = m.receiveShadow = true; parent.add(m);
  if (TWO) m.add(new THREE.Mesh(geo, thin ? LINE_THIN : LINE));
  return m;
}
const G = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
const capsule = (r, len) => new THREE.CapsuleGeometry(r, Math.max(0.001, len - r * 1.2), 5, 12);

// ── the mannequin: 7.5 heads tall, knees and elbows, a nose so facing reads ──
function person(c) {
  const U = c.height / 7.5, col = c.color;
  const TH = 1.8 * U, SH = 1.7 * U, SOLE = 0.5 * U, TORSO = 2.25 * U, NECK = 0.25 * U, UA = 1.25 * U, FA = 1.0 * U;
  const g = new THREE.Group(), body = G(g), pelvis = G(body, 0, SOLE + TH + SH, 0), marks = [];
  solid(pelvis, new THREE.SphereGeometry(0.62 * U, 16, 12), col, "cast").scale.set(1, 0.72, 0.8);
  marks.push([pelvis, 0.42 * U]);
  const legs = [-1, 1].map((s) => {
    const hip = G(pelvis, s * 0.4 * U, 0, 0); solid(hip, capsule(0.32 * U, TH), col, "cast").position.y = -TH / 2;
    const knee = G(hip, 0, -TH, 0); solid(knee, capsule(0.26 * U, SH), col, "cast").position.y = -SH / 2;
    const ankle = G(knee, 0, -SH, 0);
    const footGeo = new THREE.CapsuleGeometry(0.2 * U, 0.75 * U, 4, 10); footGeo.rotateX(Math.PI / 2);  // a rounded shoe, toe forward
    const foot = solid(ankle, footGeo, c.shoes ?? col, "cast"); foot.scale.set(1.05, 0.85, 1); foot.position.set(0, -SOLE + 0.17 * U, 0.3 * U);
    const toe = G(ankle, 0, -SOLE, 0.8 * U), heel = G(ankle, 0, -SOLE, -0.2 * U), lace = G(ankle, 0, -SOLE + 0.42 * U, 0.3 * U);
    marks.push([knee, 0.26 * U], [toe, 0], [heel, 0]);
    return { hip, knee, ankle, lace };
  });
  const spine = G(pelvis);
  solid(spine, capsule(0.6 * U, TORSO + 0.3 * U), col, "cast").position.y = TORSO / 2 + 0.05 * U;
  spine.children[0].scale.set(1, 1, 0.72);
  const neck = G(spine, 0, TORSO + NECK, 0);
  solid(neck, new THREE.SphereGeometry(0.5 * U, 20, 14), col, "cast").position.y = 0.5 * U;
  solid(neck, new THREE.ConeGeometry(0.13 * U, 0.3 * U, 10), col, "cast", true).position.set(0, 0.42 * U, 0.52 * U); neck.children[neck.children.length - 1].rotation.x = Math.PI / 2;
  const headTop = G(neck, 0, U, 0), chest = G(spine, 0, TORSO * 0.7, 0); marks.push([headTop, 0], [chest, 0.5 * U]);
  const arms = [-1, 1].map((s) => {
    const sh = G(spine, s * 0.8 * U, TORSO - 0.12 * U, 0); solid(sh, capsule(0.21 * U, UA), col, "cast").position.y = -UA / 2;
    const el = G(sh, 0, -UA, 0); solid(el, capsule(0.17 * U, FA), col, "cast").position.y = -FA / 2;
    const hand = solid(el, new THREE.SphereGeometry(0.22 * U, 12, 10), col, "cast"); hand.position.y = -FA - 0.12 * U; hand.scale.set(0.65, 1.2, 1); marks.push([hand, 0.2 * U]);
    return { sh, el, s };
  });
  const v = new THREE.Vector3(), tgt = new THREE.Vector3();
  // Put a hand on a point in the world: the shoulder aims at it and the elbow bends just enough to cover the distance.
  const reach = (arm, world) => {
    v.copy(world); spine.worldToLocal(v); v.sub(arm.sh.position);
    const L1 = UA, L2 = FA + 0.12 * U, far = v.length() || 1e-6, D = Math.min(far, (L1 + L2) * 0.999);
    const el = Math.acos(THREE.MathUtils.clamp((D * D - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1));
    const a = Math.atan2(v.z, -v.y) - Math.atan2(L2 * Math.sin(el), L1 + L2 * Math.cos(el));
    arm.sh.rotation.set(-a, 0, Math.asin(THREE.MathUtils.clamp(v.x / far, -0.9, 0.9))); arm.el.rotation.x = -el;
  };
  const apply = (st) => {
    const p = poseOf(st);
    body.rotation.x = -p.pitch; spine.rotation.x = p.lean; neck.rotation.set(p.head, p.turn, 0);
    for (const [leg, th, kn] of [[legs[0], p.thL, p.knL], [legs[1], p.thR, p.knR]]) { leg.hip.rotation.x = -th; leg.knee.rotation.x = kn; const d = kn - th; leg.ankle.rotation.x = -(d <= 0.9 ? d : 0.9 + (d - 0.9) * 0.55); }  // the foot stays flat until the shin folds far back, then follows it part of the way
    for (const [arm, shd, ab, el] of [[arms[0], p.shL, p.abL, p.elL], [arms[1], p.shR, p.abR, p.elR]]) { arm.sh.rotation.set(-shd - p.lean * 0.6, 0, arm.s * ab); arm.el.rotation.x = -el; }
    body.position.y = 0; g.updateMatrixWorld(true);
    let low = Infinity; for (const [o, r] of marks) { o.getWorldPosition(v); low = Math.min(low, v.y - r); }
    body.position.y = g.position.y - low + (p.bob ?? 0);  // whatever is lowest (a foot, a knee, the back) rests on the floor
    if (p.hands === "footL") { g.updateMatrixWorld(true); legs[0].lace.getWorldPosition(tgt); for (const arm of arms) { reach(arm, tgt); } }
  };
  return { g, apply, top: c.height + 0.12 };
}

// ── objects: a product or prop that the story follows ──────────────────────
function thing(c) {
  const g = new THREE.Group(), body = G(g), [w, h, d] = c.size, col = c.color;
  if (c.shape === "ball") solid(body, new THREE.SphereGeometry(0.5, 24, 16), col, "cast").scale.set(w, h, d);
  else if (c.shape === "cyl") solid(body, new THREE.CylinderGeometry(w / 2, w / 2, h, 28), col, "cast").scale.z = d / w;
  else if (c.shape === "bottle") { body.scale.z = d / w; solid(body, new THREE.CylinderGeometry(w / 2, w / 2, h * 0.62, 24), col, "cast").position.y = -h * 0.19; solid(body, new THREE.CylinderGeometry(w * 0.18, w / 2, h * 0.2, 24), col, "cast").position.y = h * 0.22; solid(body, new THREE.CylinderGeometry(w * 0.2, w * 0.2, h * 0.18, 20), "#ffffff", "solid").position.y = h * 0.41; }
  else if (c.shape === "shoe") {  // a sneaker drawn as its side silhouette, given the shoe's width: sole, toe box, laced slope, open collar, heel tab
    const side = (pts) => { const sh = new THREE.Shape(); sh.moveTo(...pts[0]); for (const q of pts.slice(1)) q.length === 4 ? sh.quadraticCurveTo(...q) : sh.lineTo(...q); sh.closePath(); return sh; };
    const slab = (shape, width, bevel) => { const e = new THREE.ExtrudeGeometry(shape, { depth: width - bevel * 2, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.6, bevelSegments: 3, curveSegments: 10 }); e.translate(0, -0.5, -(width - bevel * 2) / 2); e.rotateY(-Math.PI / 2); return e; };
    const sole = side([[-0.5, 0], [-0.52, 0.1, -0.5, 0.2], [0.42, 0.2], [0.53, 0.2, 0.52, 0.08], [0.5, 0, 0.42, 0]]);
    const upper = side([[-0.48, 0.18], [-0.5, 0.6, -0.47, 0.98], [-0.4, 1.0, -0.36, 0.84], [-0.24, 0.74, -0.1, 0.86], [0.02, 0.84, 0.12, 0.62], [0.3, 0.4], [0.5, 0.36, 0.49, 0.18]]);
    solid(body, slab(sole, 1, 0.06), "#ffffff", "solid").scale.set(w, h, d);
    solid(body, slab(upper, 0.9, 0.14), col, "cast").scale.set(w, h, d);
    for (const [z, y] of [[0.06, 0.72], [0.14, 0.59], [0.22, 0.47]]) { const lace = solid(body, new THREE.BoxGeometry(w * 0.5, h * 0.045, d * 0.035), "#ffffff", "solid", true); lace.position.set(0, (y - 0.5) * h + h * 0.02, z * d); lace.rotation.x = 0.9; }
  } else solid(body, new THREE.BoxGeometry(w, h, d), col, "cast");
  const apply = (st, sec) => {
    const spin = st.action === "spin", fl = st.action === "float" || (spin && c.lift > 0.05);
    body.position.y = c.lift + h / 2 + (fl ? 0.05 * Math.sin(st.time * 2.2) : 0);
    body.rotation.set(spin ? -0.06 : 0, (st.spin ?? 0) * c.turns * Math.PI * 2, 0);
  };
  return { g, apply, top: c.lift + h + 0.14 };
}

function buildScene(sc) {
  const scene = new THREE.Scene(); scene.background = TWO ? PAPER : new THREE.Color(sc.sky ?? "#e4e8ee");
  const sun = new THREE.DirectionalLight(0xffffff, TWO ? 2.6 : 2.0); sun.position.set(5, 11, 6);
  if (TWO) scene.add(new THREE.AmbientLight(0xffffff, 0.35), sun);
  else {
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8c93a0, 1.35), sun, sun.target); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
    Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 70 }); scene.fog = new THREE.Fog(sc.sky ?? "#e4e8ee", 35, 130);
  }
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), TWO ? new THREE.MeshBasicMaterial({ color: PAPER }) : new THREE.MeshStandardMaterial({ color: sc.ground ?? "#d3d6dc", roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = sc.floor; ground.receiveShadow = true; scene.add(ground);
  let marks = null;
  if (TWO) {  // small crosses every two metres: enough to feel the floor move, without a grid over the drawing
    const pts = []; for (let x = -12; x <= 12; x += 2) for (let z = -12; z <= 12; z += 2) if (x * x + z * z < 150) pts.push(x - 0.12, 0, z, x + 0.12, 0, z, x, 0, z - 0.12, x, 0, z + 0.12);
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    marks = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xa9a394 })); marks.position.y = sc.floor + 0.01; scene.add(marks);
  } else { const grid = new THREE.GridHelper(160, 80, 0xb4bac4, 0xc3c8d0); grid.position.y = sc.floor + 0.01; scene.add(grid); }
  const tags = [];
  for (const p of sc.set) {
    const g = G(scene, p.at[0], p.y, p.at[1]); g.rotation.y = p.turn; let top = 0;
    for (const [shape, sz, o] of p.pieces) {
      const geo = shape === "cyl" ? new THREE.CylinderGeometry(sz[0] / 2, sz[0] / 2, sz[1], 28) : shape === "ball" ? new THREE.SphereGeometry(0.5, 20, 14) : new THREE.BoxGeometry(sz[0], sz[1], sz[2]);
      const m = solid(g, geo, p.color ?? (sz[1] > 4 ? "#a9aeb8" : "#c2c6ce"), sz[1] > 4 ? "far" : "solid"); m.position.set(o[0], o[1] + sz[1] / 2, o[2]);
      if (shape === "ball") m.scale.set(sz[0], sz[1], sz[2]); if (shape === "cyl" && o[3] !== "x") m.scale.z = sz[2] / sz[0]; if (o[3] === "x") m.rotation.z = Math.PI / 2;
      top = Math.max(top, o[1] + sz[1]);
    }
    if (p.label) tags.push({ obj: g, up: top + 0.12, text: p.label, color: "#5c626d" });
  }
  const actors = sc.actors.map((a) => {
    const rig = a.kind === "object" ? thing(a) : person(a); scene.add(rig.g);
    const blob = new THREE.Mesh(new THREE.CircleGeometry(a.kind === "object" ? Math.max(a.size[0], a.size[2]) * 0.55 : 0.36, 24), new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.2 }));
    blob.rotation.x = -Math.PI / 2; blob.visible = TWO; scene.add(blob);
    if (REVIEW && a.trail && a.dist[120] > 1.5) {  // a line on the floor with an arrowhead: where this one travels in the shot
      const pos = [], idx = [], wd = 0.05, y = a.floor + 0.025, P = a.P;
      const push = (p, n) => pos.push(p[0] - n[1] * wd, y, p[1] + n[0] * wd, p[0] + n[1] * wd, y, p[1] - n[0] * wd);
      for (let i = 0; i < P.length - 1; i++) {
        const dx = P[i + 1][0] - P[i][0], dz = P[i + 1][1] - P[i][1], l = Math.hypot(dx, dz); if (l < 0.01) continue; const n = [dx / l, dz / l], k = pos.length / 3;
        const last = i === P.length - 2, e = last ? [P[i + 1][0] - n[0] * 0.35, P[i + 1][1] - n[1] * 0.35] : P[i + 1];
        push(P[i], n); push(e, n); idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
        if (last) { const j = pos.length / 3; pos.push(e[0] - n[1] * 0.2, y, e[1] + n[0] * 0.2, e[0] + n[1] * 0.2, y, e[1] - n[0] * 0.2, P[i + 1][0], y, P[i + 1][1]); idx.push(j, j + 1, j + 2); }
      }
      const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx);
      scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: TWO ? INK : new THREE.Color(a.color), transparent: true, opacity: TWO ? 0.55 : 0.6, side: THREE.DoubleSide })));
    }
    tags.push({ obj: rig.g, up: rig.top, text: a.label, color: a.color, actor: a });
    return { a, rig, blob };
  });
  if (REVIEW) for (const t of tags) { t.el = document.createElement("div"); t.el.className = "tag"; t.el.textContent = t.text; t.el.style.background = t.color; t.el.style.display = "none"; pic.appendChild(t.el); }
  return { sc, scene, actors, tags, sun, marks };
}

const built = stage.scenes.map(buildScene), v = new THREE.Vector3();
const slateParts = [["b", ""], ["span", ""], ["span", "dim"], ["span", "sp"], ["span", "dim"]].map(([el, cls]) => { const e = document.createElement(el); e.className = cls; slate.appendChild(e); return e; });
const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const frameOfBeatIn = (s, bt) => frameOfBeat(RANGES[s.index], bt, FPS);
const RANGES = frameRanges(stage, FPS), FRAMES = RANGES.at(-1).last + 1;
function setFrame(f) {
  f = Math.max(0, Math.min(FRAMES - 1, Math.round(f)));
  let i = RANGES.length - 1; while (i > 0 && f < RANGES[i].first) i--;  // the scene is chosen by frame number, never by comparing clock times
  const B = built[i], sc = B.sc, t = Math.min(sc.seconds, (f - RANGES[i].first) / FPS), time = sc.start + t;
  for (const { a, rig, blob } of B.actors) {
    const st = actorAt(a, t, sc.seconds);
    rig.g.position.set(...st.pos); rig.g.rotation.y = st.face; rig.apply(st, sc.seconds);
    blob.position.set(st.pos[0], (st.shadow ?? st.ground) + 0.02, st.pos[2]);
  }
  const c = sc.camera.at(t);
  camera.position.set(...c.pos); camera.fov = c.fov; camera.updateProjectionMatrix(); camera.lookAt(...c.look); camera.updateMatrixWorld();
  if (B.marks) B.marks.position.set(Math.round(c.look[0] / 2) * 2, sc.floor + 0.01, Math.round(c.look[2] / 2) * 2);  // the floor marks stay near the action, fixed to the world grid
  if (!TWO) { B.sun.target.position.set(c.look[0], sc.floor, c.look[2]); B.sun.position.set(c.look[0] + 5, sc.floor + 11, c.look[2] + 6); B.sun.target.updateMatrixWorld(); }
  renderer.render(B.scene, camera);
  if (REVIEW) {
    for (const b of built) for (const tg of b.tags) {
      if (b !== B) { tg.el.style.display = "none"; continue; }
      tg.obj.getWorldPosition(v); v.y += tg.up; const w = [v.x, v.y - 0.25, v.z]; v.project(camera);
      const on = v.z < 1 && Math.abs(v.x) < 0.96 && v.y > -0.96 && v.y < 0.9 && !blocked(sc, c.pos, w);
      tg.el.style.display = on ? "block" : "none"; tg.el.style.left = ((v.x + 1) / 2 * W) + "px"; tg.el.style.top = ((1 - v.y) / 2 * H) + "px";
    }
    slateParts[0].textContent = `${i + 1}/${built.length}`; slateParts[1].textContent = sc.title; slateParts[2].textContent = sc.camera.desc; slateParts[4].textContent = `${mmss(time)} / ${mmss(stage.seconds)}`;  // text nodes only: a title is never markup
    if (CAPTIONS) cap.textContent = sc.note;
  }
}
window.setFrame = setFrame;
window.KONTE = { ready: true, run: q.get("run"), errors: [], fps: FPS, frames: FRAMES, ranges: RANGES, width: W, height: OUT_H, title: stage.title, lint: lint(stage),
  scenes: stage.scenes.map((s) => ({ title: s.title, note: s.note, start: s.start, seconds: s.seconds, camera: s.camera.desc, cameraLong: cameraWords(s), beats: s.beats, frames: s.beats.map((bt) => frameOfBeatIn(s, bt)) })) };
setFrame(0);
if (!location.hash.startsWith("#capture")) { const t0 = performance.now(); const loop = (now) => { setFrame(Math.floor(((now - t0) / 1000) * FPS) % FRAMES); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
